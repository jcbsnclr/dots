# Navi 10 HDMI/DP audio (ryzen-desktop): keep the card on the Acer B247Y E
# (DP-3) output.
#
# The card also exposes the PHL 227E6 on HDMI-A-1, which has no speakers but
# a higher ALSA profile priority (hdmi-stereo, 5900) than the Acer's
# hdmi-stereo-extra3 (5700), so the automatic fallback picks the silent
# output whenever the stored profile is not restored (e.g. cold boot before
# DP-3 reports its ELD).
#
# The rules match this card's PCI address and AMD product ID, so they are
# inert on hosts that do not have it (e.g. the X1 Carbon).
#
# WirePlumber also derives the sink name from the HDMI PCM name, which is
# occasionally the other port's monitor; pin the description so the Acer is
# always recognisable in pavucontrol/waybar.

device.profile.priority.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_09_00.1"
        device.product.id = "0xab38"
      }
    ]
    actions = {
      update-props = {
        priorities = [
          "output:hdmi-stereo-extra3"
        ]
      }
    }
  }
]

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_09_00.1"
        device.product.id = "0xab38"
      }
    ]
    actions = {
      update-props = {
        # absolute fallback when there is no stored profile
        device.profile = "output:hdmi-stereo-extra3"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_09_00.1.hdmi-stereo-extra3"
      }
    ]
    actions = {
      update-props = {
        node.description = "Acer B247Y E (DisplayPort)"
      }
    }
  }
]
