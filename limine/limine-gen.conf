# Configuration for limine-gen.  All settings are optional; the values
# shown here are the defaults used when a setting is left unset.

# Kernel command line for generated entries.  Empty means "copy the running
# system's /proc/cmdline" (with BOOT_IMAGE= and initrd= stripped).
CMDLINE=""

# Boot menu timeout in seconds (0 = boot immediately, no = wait forever).
TIMEOUT=3

# Append BLAKE2b-512 checksums to kernel/ucode/initramfs paths (needs python3).
HASHES=yes

# Also generate a checksum-less recovery entry for every kernel.
RECOVERY=yes

# Add a chainload entry for the previous bootloader.
CHAINLOAD_GRUB=yes
GRUB_LOADER=/EFI/grub/grub-standalone.efi
